server:
  port: 8080

spring:
  application:
    name: template-backend

  # Datasource Configuration (PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/template}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyWithAtLeast32CharactersLongForHS256Algorithm}
  expiration: ${JWT_EXPIRATION:86400000}

# Logging
logging:
  level:
    org.springframework.security: INFO
    com.starter.template: DEBUG
    org.hibernate.SQL: DEBUG

# Actuator Endpoints (optional)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
